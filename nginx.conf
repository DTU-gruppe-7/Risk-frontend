# Komplet nginx-konfiguration. Erstatter base-imagets /etc/nginx/nginx.conf, så intet
# fra imagets standardopsætning (fx conf.d/*.conf) kommer med uden at stå her.
#
# Containeren kører med --read-only og en tmpfs på /tmp, så alt, nginx skriver
# (pid og temp-filer), ligger i /tmp, og logs går til stdout/stderr.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Til deploy-scriptets health-tjek
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite giver filerne hash i navnet (index-a1b2c3.js), så de kan caches for evigt
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA-fallback: ukendte stier går til index.html, så TanStack Router kan route dem.
        # index.html må aldrig caches, ellers ser brugerne ikke nye deploys.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
