# Komplet nginx-konfiguration. Erstatter base-imagets /etc/nginx/nginx.conf, så intet
# fra imagets standardopsætning (fx conf.d/*.conf) kommer med uden at stå her.
#
# Containeren kører med --read-only og en tmpfs på /tmp, så alt, nginx skriver
# (pid og temp-filer), ligger i /tmp, og logs går til stdout/stderr.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Vite giver filerne hash i navnet (index-a1b2c3.js), så de kan caches for evigt.
    # Alt andet, også index.html, må aldrig caches, ellers ser brugerne ikke nye deploys.
    map $uri $cache_control {
        ~^/assets/  "public, max-age=31536000, immutable";
        default     "no-cache";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Alle headers sættes her og aldrig i en location. En add_header i en location
        # sletter alle add_header fra niveauet over, så headerne ville forsvinde dér.
        add_header Cache-Control $cache_control;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Til deploy-scriptets health-tjek
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Manifestet skal have den rigtige MIME-type. Afhængigt af version kender nginx' mime.types ikke .webmanifest.
        location = /manifest.webmanifest {
            types { }
            default_type application/manifest+json;
        }

        location /assets/ {
            try_files $uri =404;
        }

        # SPA-fallback: ukendte stier går til index.html, så TanStack Router kan route dem.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
