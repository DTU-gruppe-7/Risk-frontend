server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Til deploy-scriptets health-tjek
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite giver filerne hash i navnet (index-a1b2c3.js), så de kan caches for evigt
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-fallback: ukendte stier går til index.html, så TanStack Router kan route dem.
    # index.html må aldrig caches, ellers ser brugerne ikke nye deploys.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
