version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      tanstack:
        patterns: ['@tanstack/*']
      lint-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*']
      build:
        patterns: ['vite', '@vitejs/*', 'typescript', 'tailwindcss', '@tailwindcss/*']

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    # Dagligt: base-images genbygges med sikkerhedsrettelser, og Trivy i CI fejler på dem
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
