version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      tanstack:
        patterns: ['@tanstack/*']
      lint-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*']
      build:
        patterns: ['vite', '@vitejs/*', 'typescript', 'tailwindcss', '@tailwindcss/*']
    ignore:
      # typescript-eslint 8.x understøtter kun TypeScript < 6.1
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Typerne skal matche Node-versionen i Dockerfile
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    # Dagligt: base-images genbygges med sikkerhedsrettelser, og Trivy i CI fejler på dem
    schedule:
      interval: daily
    ignore:
      # Kun LTS-versioner af Node; skift major manuelt sammen med @types/node
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
