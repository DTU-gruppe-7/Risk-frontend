name: Trivy

# Nat-scanning af develop: fanger nye CVE'er i et uændret image. Fejler (og giver besked)
# ved kendte, rettede CRITICAL/HIGH-sårbarheder, og opdaterer code scanning, så fundene
# lukkes automatisk, når de er rettet.
on:
  schedule:
    - cron: '30 0 * * *' # før CD's nat-build kl. 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Byg image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: risk-frontend:scan
          load: true
          cache-from: type=gha,scope=frontend

      - name: Trivy-scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: risk-frontend:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload Trivy-resultater
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Trivy-scan (blokerende)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: 'true' # databasen er hentet i forrige trin
        with:
          image-ref: risk-frontend:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
