name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format og build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: ingen husky og ingen postinstall-scripts fra tredjepartspakker
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint -- --max-warnings=0
      - run: npm run build

  smoke-test:
    name: Docker smoke-test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload af Trivy-resultater til code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Byg image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: risk-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start med produktions-hærdning og tjek
        run: |
          test "$(docker image inspect risk-frontend:ci --format '{{.Config.User}}')" = "65532"
          docker run -d --name fe -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            risk-frontend:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/en/dyb/rute     # SPA-fallback

      - name: Tjek security headers og caching
        run: |
          headers() { curl -fsS -o /dev/null -D - "http://localhost:8080$1" | tr -d '\r'; }
          for path in / /en/dyb/rute; do
            h="$(headers "$path")"
            echo "$h" | grep -qi "^content-security-policy: .*frame-ancestors 'none'"
            echo "$h" | grep -qi '^x-content-type-options: nosniff'
            echo "$h" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
            echo "$h" | grep -qi '^cache-control: no-cache'
          done
          asset="$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -n 1)"
          h="$(headers "$asset")"
          echo "$h" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          echo "$h" | grep -qi '^content-security-policy: '

      - name: Container-log ved fejl
        if: failure()
        run: docker logs fe || true

      # Rapporterer, men blokerer ikke: CVE'er i base-imaget opstår uafhængigt af PR'et og
      # skal ikke stoppe urelateret arbejde. Fundene vises på PR'et via code scanning.
      # Den blokerende scanning sker i CD, før et image pushes, og i trivy.yml hver nat.
      - name: Trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: risk-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload Trivy-resultater
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
